plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.shopflow'
version = '0.0.1-SNAPSHOT'
description = 'ShopFlow - service Commande'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Lombok n'est utile qu'à la compilation : il n'est pas embarqué dans le JAR final
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Version de Spring Cloud compatible avec Spring Boot 4.2 (train 2026.0, « Paddington »)
ext {
    set('springCloudVersion', '2026.0.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'
    // Client HTTP déclaratif pour appeler catalog-service (communication synchrone)
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // Base en mémoire : rien à installer pour démarrer
    runtimeOnly 'com.h2database:h2'
    // Spring Boot 4 est découpé en modules : la console H2 a le sien
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    // Pour passer à PostgreSQL : voir le commentaire dans application.yml
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4 : @WebMvcTest est fourni par le module de test de Spring MVC
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Le BOM Spring Cloud fixe les versions de toutes les briques Spring Cloud
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
