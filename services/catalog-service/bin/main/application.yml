server:
  port: 8081

spring:
  application:
    name: catalog-service
  datasource:
    # Base H2 en mémoire : elle est recréée à chaque démarrage du service.
    # Pour utiliser PostgreSQL installé sur la machine, remplacer ces trois lignes par :
    #   url: jdbc:postgresql://localhost:5432/catalog_db
    #   username: catalog
    #   password: catalog
    url: jdbc:h2:mem:catalog_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      # Console web de la base : http://localhost:8081/h2-console
      # (JDBC URL : jdbc:h2:mem:catalog_db, utilisateur : sa, sans mot de passe)
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
