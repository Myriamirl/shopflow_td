  url: "{{notification}}/api/v1/notifications"
  body:
    type: json
    data: |-
      {
        "to": "alice@shopflow.example",
        "subject": "Test notification",
        "body": "Commande reçue"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("202", function() {
          expect(res.getStatus()).to.equal(202);
        });

settings:
