info:
  name: stock du produit 1
  type: http
  seq: 1

http:
  method: GET
  url: "{{inventory}}/api/v1/stock/1"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 et quantity 10", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().quantity).to.equal(10);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
